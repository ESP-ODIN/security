basePath: /
definitions:
  dto.DecisionRequest:
    properties:
      decision:
        description: approved | rejected
        type: string
      reason:
        type: string
    type: object
  dto.DecisionResponse:
    properties:
      decided_by:
        format: uuid
        type: string
      decision:
        type: string
      reason:
        type: string
      run_id:
        format: uuid
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: invalid agent id
        type: string
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.PermissionsResponse:
    properties:
      agent_id:
        format: uuid
        type: string
      permissions:
        items:
          $ref: '#/definitions/model.Permission'
        type: array
      version_id:
        format: uuid
        type: string
    type: object
  dto.PipelineRunsResponse:
    properties:
      runs:
        items:
          $ref: '#/definitions/model.PipelineRun'
        type: array
      status:
        type: string
    type: object
  dto.SecurityReportResponse:
    properties:
      agent_id:
        format: uuid
        type: string
      sandbox_access:
        items:
          $ref: '#/definitions/model.Finding'
        type: array
      secrets:
        items:
          $ref: '#/definitions/model.Finding'
        type: array
      version_id:
        format: uuid
        type: string
      vulnerabilities:
        items:
          $ref: '#/definitions/model.Finding'
        type: array
    type: object
  dto.SecurityStatusResponse:
    properties:
      agent_id:
        format: uuid
        type: string
      decision:
        type: string
      step:
        type: string
      version_id:
        format: uuid
        type: string
    type: object
  dto.SubmitVersionResponse:
    properties:
      agent_id:
        format: uuid
        type: string
      idempotency_key:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  model.Finding:
    properties:
      message:
        type: string
      type:
        type: string
    type: object
  model.Permission:
    properties:
      name:
        type: string
      scope:
        type: string
    type: object
  model.PipelineRun:
    properties:
      agent_id:
        format: uuid
        type: string
      decided_by:
        format: uuid
        type: string
      decision:
        type: string
      id:
        format: uuid
        type: string
      reason:
        type: string
      status:
        type: string
      step:
        type: string
      version_id:
        format: uuid
        type: string
    type: object
info:
  contact: {}
  description: Security pipeline API for ODIN agent versions (normalize, quarantine,
    analyze, smoke test, sandbox).
  title: ODIN Security API
  version: "1.0"
paths:
  /api/v1/admin/security/pipeline-runs:
    get:
      description: Lists security pipeline runs, typically those awaiting manual review.
        The caller must be listed in ADMIN_USER_IDS.
      parameters:
      - default: manual_review
        description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PipelineRunsResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List pipeline runs
      tags:
      - admin
  /api/v1/admin/security/pipeline-runs/{runId}/decision:
    put:
      consumes:
      - application/json
      description: Records a manual decision for complementary analysis. Body must
        include decision (approved or rejected) and reason. The reason and the admin
        id are stored for audit.
      parameters:
      - description: Pipeline run ID
        format: uuid
        in: path
        name: runId
        required: true
        type: string
      - description: Manual decision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DecisionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Decide on a pipeline run
      tags:
      - admin
  /api/v1/agents/{id}/versions:
    post:
      consumes:
      - application/json
      description: 'Submits a new version and starts the security pipeline (normalize,
        quarantine, analyze, smoke test, sandbox). Idempotent via Idempotency-Key:
        the same key does not start a second run.'
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Idempotency key to avoid duplicate pipeline runs
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.SubmitVersionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit a new agent version
      tags:
      - versions
  /api/v1/agents/{id}/versions/{versionId}/permissions:
    get:
      description: Returns permissions declared in this version's manifest (useful
        to compare with the previous version)
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Version ID
        format: uuid
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PermissionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List version permissions
      tags:
      - versions
  /api/v1/agents/{id}/versions/{versionId}/security:
    get:
      description: Returns the pipeline status for this version (current step, decision)
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Version ID
        format: uuid
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SecurityStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get security pipeline status
      tags:
      - security
  /api/v1/agents/{id}/versions/{versionId}/security/report:
    get:
      description: Returns detailed analysis results (secrets, vulnerabilities, observed
        sandbox access)
      parameters:
      - description: Agent ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Version ID
        format: uuid
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SecurityReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get security analysis report
      tags:
      - security
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      description: Pings the database on every request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Readiness check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: JWT issued by Auth, sent as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
